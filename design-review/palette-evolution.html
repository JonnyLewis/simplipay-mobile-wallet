<script>
const DATA = {"brief": "# SimpliPay Splash + Home \u2014 Bold Redesign Creative & Scoring Brief\n\n*Synthesis of Wada (combination logic), Adams (color principles), 2026 trend scan, and awards-jury rubric. Written for a generative design agent. Graphite directions welcome.*\n\n---\n\n## A. DESIGN PRINCIPLES (Wada \u00d7 Adams, actionable)\n\n1. **One undertone, no primaries.** Pull every swatch toward a single low-chroma undertone; never emit pure `#FF0000`/`#0000FF`/`#FFFF00` or pure `#000`/`#FFF`. Tint neutrals warm or cool to match the dominant's temperature (Wada's pre-greyed vocabulary + Adams' \"off-primary always\").\n2. **Two chromatic voices, max.** Exactly ONE dominant + ONE accent. Every additional hue is an error, not an option. Neutrals and whitespace carry the rest (Adams' restraint = fewer colors, not weaker ones).\n3. **60 / 30 / 10 structure.** Dominant owns ~60% (brand, chrome, surfaces), neutral ~30% (backgrounds, text, structure), accent \u226410% (CTA, balance, up-states). On graphite grounds, cap accent at 5\u201315%.\n4. **Separate by hue, not brightness \u2014 then admit one \"event.\"** Cluster fields in a mid-value band differentiated by hue; introduce a single escape note (a vivid accent OR a graphite anchor) that breaks the band. That lone break is the only place boldness lives (Wada's dominant\u2192subordinate\u2192accent).\n5. **Value contrast does the heavy lifting.** Require \u226540 L* between dominant and accent. Most \"which hue\" problems are really \"which value/saturation.\" Strong dark-to-light hierarchy reads premium; muddy mid-tones read cheap.\n6. **Temperature tension over analogous safety.** Pair a cool dominant with a warm accent (graphite + cinnabar, navy + amber, forest + coral). Neighbors on the wheel read forgettable; cross-temperature reads alive.\n7. **Muted is the field, vivid is the event.** The accent is scarce by rule \u2014 reserved for meaning-bearing moments (the balance figure, the \"Pay,\" the confirmation, the active tab). Scarcity is what makes it read intentional and expensive, not loud.\n8. **Design the pair, not the swatch.** Meaning lives in the relationship. Decide dominant\u2194accent *relationship* first (navy+gold = established; graphite+lime = terminal/modern; teal+coral = human), pick exact hexes second.\n9. **Material lineage keeps bold from tipping gaudy.** Prefer accents with a pigment/mineral/dye ancestry \u2014 cinnabar, vermilion, ochre, verdigris, cobalt, saffron, marigold, terra cotta. Built-in impurity is what separates \"crafted fintech\" from \"crypto casino.\"\n10. **Semantics are locked, not decorative.** Green = positive/received, gold = warning/value, red = errors/declines ONLY (never a brand primary, or every screen feels like an emergency). Keep semantic hues out of the brand-accent slot.\n11. **Commit at full conviction.** A bold color at 100% intent beats a timid tint. Once the accent is chosen, make it load-bearing \u2014 it should *mean* \"money / action / go\" everywhere it appears.\n12. **Neutrals are active design.** A precisely tuned warm-or-cool graphite/off-white is the premium interface. Never unmodulated `#808080`. Canvas, elevated surface, and hairline border are three deliberate tinted steps, not one flat slab.\n\n---\n\n## B. BOLDNESS GUARDRAILS (bold without tasteless or untrustworthy)\n\n- **Bold = one brave decision, executed with obsessive consistency** \u2014 not many loud choices. Conviction over decoration. If a screen has two \"wow\" moments, one is noise.\n- **Put boldness in the accent's *conviction and placement*, never its *area*.** Loud color flooding a money screen erodes trust; the same hue at \u226410%, on the balance and the CTA, reads confident.\n- **Graphite is the safe way to be bold.** A near-black canvas (`#0E0E12`\u2013`#1A1A20`) makes a single saturated accent snap without the palette ever feeling risky \u2014 the Mercury/Robinhood move. Full brand-color floods (Cash App/Nubank) are reserved for **splash only**, never behind live financial data.\n- **Never fake richness with effects.** Richness comes from value contrast + restraint, not gradients-as-decoration, glows, or drop shadows. Aurora/mesh is allowed only as *ambient lighting* behind a hero, low-motion, 2\u20133 stops.\n- **Red is quarantined.** No red brand primary, no red CTA. Red only for declines/errors/negative deltas. A wallet that feels like an emergency is untrustworthy.\n- **Yellow becomes gold.** Desaturate toward warm gold for value/optimism; pure high-chroma yellow reads as caution/warning and induces anxiety.\n- **Accessibility is a gate, not a garnish.** WCAG AA on the balance, labels, nav, and buttons is non-negotiable \u2014 an inaccessible screen is disqualified regardless of beauty. Never convey state by color alone (pair with icon/label/sign).\n- **Motion must reinforce hierarchy, never perform.** Physics-based, spatial, continuous. Splash\u2192Home must be one move, not a cut. Gratuitous or janky animation reads amateur and is penalized.\n- **Trust anchors stay quiet.** Balance legibility, tabular numerals, predictable spacing rhythm, and consistent radii signal a token system \u2014 the substrate that lets you spend boldness elsewhere without looking reckless.\n- **Test the \"casino line\":** if the accent appears in >2 distinct roles per screen, or a second saturated hue competes with it, or any surface is high-saturation with no rest \u2014 you've crossed from bold to cheap. Pull back to one event.\n\n---\n\n## C. TREND TARGETS (6 most award-relevant 2026 directions)\n\n1. **Graphite canvas + one load-bearing accent** (the \"serious money\" default). Near-black shell (`#0E0E12` canvas, `#1A1A20` surface, `#2A2A33` hairline), a single saturated brand hue doing all signal work. Mercury/Robinhood lineage. Safest bold direction \u2014 *lead here.*\n2. **Balance-as-hero with odometer roll-up.** Primary balance at 48\u201360px, heavy grotesque, **tabular/lining numerals**, top-of-screen, animating up on load \u2014 the single largest, brightest element. Cash App/Revolut signature moment. This is the highest-value hierarchy play.\n3. **Bento-grid Home, continuous-corner squircles (24\u201328px radius).** Replace vertical lists: balance tile large, Send/Request/Scan/Pay as a medium row of filled duotone glyphs in squircles, insights/recent as small tiles. Reads 2025\u201326 instantly.\n4. **Card-as-rendered-object.** Material on the wallet card \u2014 subtle grain or metallic sheen, thin light top-border, gyroscope-reactive glint on tilt. Highest perceived-quality-per-effort detail (Revolut metal / Apple Card titanium).\n5. **Animated wordmark on a living aurora field \u2192 shared-element handoff to Home.** Splash opens on graphite with a slow-drifting 2\u20133-stop mesh (brand hue + one dopamine secondary), wordmark draws in spring-settled, then compresses into the Home balance tile. No hard cut \u2014 one continuous move. (Builds directly on the existing animated-wordmark commit.)\n6. **Dopamine as *data coding*, not chrome.** Shell stays graphite + one accent; spending categories/accounts each carry a vivid secondary (lime, magenta, tangerine, cyan) in insights tiles and transaction rows. Restrained luxury base + dopamine in the data = 2026, not 2022-flat. Pair with spring physics + haptic-synced success (checkmark, light confetti on completed payment).\n\n*Palette scaffold to build from:* canvas `#0E0E12` \u00b7 surface `#1A1A20` \u00b7 hairline `#2A2A33` \u00b7 text-primary `#F5F5F7` \u00b7 text-secondary `#9A9AA6` \u00b7 **one brand accent** (candidates: cinnabar `#D64A2E`, verdigris `#37A08C`, chrome/marigold `#E7B21E`, or a shifted violet/lime) \u00b7 plus a 4-hue dopamine set for category coding only.\n\n---\n\n## D. SCORING RUBRIC (6 axes; 3 / 6 / 9 anchors)\n\nScore each 0\u20139. **Accessibility is a gate:** a score of \u22644 there caps the overall composite at 5, regardless of other axes (juries treat accessibility failures as disqualifying).\n\n### 1. BOLDNESS\n- **3** \u2014 Timid, unowned mid-tones; no single brave decision; palette hedges. Interchangeable with any template wallet.\n- **6** \u2014 A clear accent exists and is committed, but plays it safe (stock-ish blue, or accent under-used so nothing is memorable).\n- **9** \u2014 One brave, ownable move executed with total conviction \u2014 a graphite+signature-accent system or a full brand-color splash that a juror could name afterward. Bold in conviction, disciplined in area.\n\n### 2. TASTE (restraint / non-gaudy)\n- **3** \u2014 Multiple saturated hues competing; effects faking richness; high-saturation with no rest; feels like a casino or a rainbow dashboard.\n- **6** \u2014 Two chromatic voices held, mostly clean, but one lapse (accent slightly over-extended, a gratuitous gradient, an untinted flat gray).\n- **9** \u2014 Exactly one dominant + one accent, material-lineage hues, richness from value+restraint only, generous confident whitespace. Editorial calm \u00e0 la Mercury/Ramp.\n\n### 3. HIERARCHY (single hero)\n- **3** \u2014 Emphasis spread evenly; no eye-entry; balance competes with chrome; can't tell what matters.\n- **6** \u2014 Balance is clearly primary but subordinates are noisy or the eye-path wobbles.\n- **9** \u2014 Instant, unmistakable read: one hero (the balance), obvious eye-entry, actions and lists cleanly subordinate. Bento sizing and value contrast do the ranking.\n\n### 4. TREND-FIT (2026)\n- **3** \u2014 2022-flat: vertical list, flat card rectangle, linear easing, generic sizing, no signature motion.\n- **6** \u2014 Adopts some 2026 cues (graphite base OR bento OR big balance) but partially, or mixes in dated patterns.\n- **9** \u2014 Coherent 2026 stack: graphite+one-accent shell, bento squircles, oversized tabular balance with roll-up, rendered card object, dopamine-as-data, spring-physics + shared-element splash\u2192Home continuity.\n\n### 5. AWARD-WORTHINESS (signature + craft + motion)\n- **3** \u2014 Template-grade; no memorable element; inconsistent spacing/radii/icon weight; motion gratuitous or absent.\n- **6** \u2014 Competent and consistent token system, one nice moment, but no ownable signature a juror would recall.\n- **9** \u2014 A repeatable ownable signature (mark animation, distinctive tile, numeral style, color equity) + obsessive spacing/radius/icon consistency + purposeful physics-based motion with a continuous splash\u2192Home transition. Copilot/Not-Boring caliber. **Wallet discriminators \u2014 numeral craft, motion continuity, and restraint/density balance \u2014 must all score \u22657 for a 9 here.**\n\n### 6. ACCESSIBILITY *(GATE)*\n- **3** \u2014 Fails WCAG AA on key pairs (balance, labels, nav, buttons); state conveyed by color alone; dark-mode-as-afterthought or wash-out. **Caps composite at 5.**\n- **6** \u2014 AA met on body/large text and full light/dark parity, but tight margins or one weak pair (secondary text, hairline-on-surface).\n- **9** \u2014 AA comfortably (ideally AAA on the balance), nothing by color alone (icon/label/sign paired), brand accent holds up on both grounds, flawless light/dark parity, legible at arm's length.\n\n---\n\n**Composite guidance for the generator:** target \u22657 on axes 1\u20135 with axis 6 \u22657 as a hard gate. The finalist-vs-winner separation for a *wallet specifically* lives in **numeral craft, splash\u2192Home motion continuity, and restraint/density balance** \u2014 weight those when breaking ties between otherwise-equal directions.", "research": {"wada": "# The Working Logic of Sanzo Wada's *A Dictionary of Color Combinations* \u2014 for a Fintech Wallet Palette\n\n## (1) How Wada builds combinations \u2014 the harmony logic\n\nSanzo Wada (1883\u20131967) was a Japanese artist, teacher, and costume/color theorist. His *Haishoku S\u014dkan* (published in six volumes, late 1920s\u201330s) is built on top of his companion *Dictionary of Color* \u2014 a systematic catalog of **~159 named colors** organized by hue and tone. The combination book then draws 2-, 3-, and 4-color sets from that fixed vocabulary. The working logic:\n\n- **A closed, pre-tuned vocabulary.** Every combination is assembled from the same limited named set, so any two Wada colors already \"belong\" to one tonal universe. Nothing is fully saturated primary; everything has been pre-greyed toward a shared, slightly-dusty key. This is the single most important trait to copy: **desaturate your whole palette toward one common undertone before you start combining.**\n\n- **Dominant \u2192 subordinate \u2192 accent (value-controlled).** In a 3- or 4-color set Wada holds most of the swatches within a **narrow value band** and lets *hue* do the separating work, then admits **one** note that breaks the band \u2014 either a darker anchor or a brighter accent. Contrast is engineered through hue-rotation and small value steps, not through blasting brightness. A wallet UI reading of this: pick 2\u20133 mid-value muted fields that differ in hue but not much in lightness, then add exactly one \"escape\" color.\n\n- **Muted as the field, vivid as the event.** Wada's \"vivid\" colors are *relatively* vivid \u2014 a mustard, a vermilion, a teal \u2014 but they are always the minority area. The muted majority earns the vivid its punch. In practice the vivid never carries more than roughly a quarter of the composition; it's the CTA, the balance figure, the active state \u2014 never the background.\n\n- **Historical & natural sourcing.** The colors are named for pigments, dyes, minerals, plants, and places \u2014 *Etruscan Red, Pompeian Red, Hay's Russet, Cosse (pea-pod) Green, Cendre Blue, Verdigris, Terra Cotta, Chrome, Cinnabar, Indian Lake, Corinthian Purple*. This is why the palette feels grounded and never neon: each color descends from a physical material with a built-in impurity. For a fintech brand this reads as *trustworthy, crafted, non-synthetic* \u2014 bold without looking like a crypto casino.\n\n**Net rule for the generator:** one shared low-chroma undertone \u2192 cluster most swatches in a mid-value band separated by hue \u2192 introduce a single vivid or a single graphite as the \"event\" \u2192 keep the vivid's area small.\n\n---\n\n## (2) Twelve Wada combinations for a BOLD-but-tasteful mobile wallet\n\nHex values are approximations of Wada's swatches, nudged into a coherent app palette. Each is labeled with mood. Treat the **first color as the field/ground**, the **last as the accent/CTA** unless noted.\n\n| # | Combination (field \u2192 \u2026 \u2192 accent) | Approx. hex | Mood for a wallet |\n|---|---|---|---|\n| 1 | Cendre Blue + Ivory + Vermilion | `#3E5C74` \u00b7 `#EDE6D2` \u00b7 `#D94F32` | **Confident & modern** \u2014 calm slate-blue app chrome, warm paper cards, hot-coral primary action. |\n| 2 | Deep Teal + Sand + Old Gold | `#1F5A56` \u00b7 `#DCCFA8` \u00b7 `#C8A24B` | **Premium / private-banking** \u2014 moneyed, evergreen-and-brass without gaudiness. |\n| 3 | Aubergine + Dusty Rose + Ochre | `#4A2E3D` \u00b7 `#C99AA0` \u00b7 `#C9922E` | **Warm & human** \u2014 softer, approachable fintech; good for a lifestyle/spending view. |\n| 4 | Prussian Indigo + Fog Grey + Chrome Yellow | `#26364F` \u00b7 `#C4C6C1` \u00b7 `#E7B622` | **Trust + energy** \u2014 classic banking navy given a jolt; strong for onboarding. |\n| 5 | Forest Olive + Cream + Cinnabar | `#4C5335` \u00b7 `#EFE8D4` \u00b7 `#C0492B` | **Grounded & earthy** \u2014 sustainability/impact-finance tone, editorial and calm. |\n| 6 | Corinthian Purple + Mauve Grey + Terra Cotta | `#5B3A57` \u00b7 `#A99BA4` \u00b7 `#B85C3C` | **Distinctive & upscale** \u2014 a differentiated non-blue brand that still feels safe. |\n| 7 | Slate Blue + Pale Straw + Verdigris | `#48606E` \u00b7 `#E4DCC0` \u00b7 `#3E8C7E` | **Fresh & trustworthy** \u2014 blue-green pairing that signals \"secure and growing.\" |\n| 8 | Charcoal Green + Bone + Marigold | `#33413B` \u00b7 `#E8E2D2` \u00b7 `#E3A11C` | **Sleek & optimistic** \u2014 near-neutral dark-green shell with a bright savings-goal accent. |\n| 9 | Wine Red + Blush + Cendre Blue | `#6E2C34` \u00b7 `#D8B4AB` \u00b7 `#4A6C82` | **Bold & assured** \u2014 deep-red brand with a cool-blue counterweight; memorable, adult. |\n| 10 | Peacock + Ivory + Coral Pink | `#1E5F6E` \u00b7 `#EDE6D4` \u00b7 `#E08277` | **Playful-premium** \u2014 energetic teal/coral for a younger wallet that still looks tasteful. |\n| 11 | Muted Cobalt + Greige + Saffron | `#2F4E7E` \u00b7 `#CFC7B6` \u00b7 `#E0942A` | **Reliable & warm** \u2014 the \"friendly bank\" combo; cobalt authority softened by saffron. |\n| 12 | Plum Brown + Oat + Jade | `#4A3630` \u00b7 `#DED6C0` \u00b7 `#2E8C74` | **Rich & reassuring** \u2014 warm dark-brown base with a jade \"positive/received\" accent. |\n\nUsage note for all twelve: keep the middle (ivory/sand/greige) as the surface and card fill, the field color as headers/nav, and the accent reserved for primary CTAs, positive-balance figures, and active states.\n\n---\n\n## (3) Four combinations pairing a GRAPHITE / near-black neutral with a single vivid accent\n\nThese are the dark-mode / high-contrast anchors. Graphite is the near-black **ground**, plus a supporting off-white and **one** vivid \u2014 Wada-style: the dark makes the vivid the sole event.\n\n| # | Graphite + support + vivid accent | Approx. hex | Mood |\n|---|---|---|---|\n| A | Ink Graphite + Bone White + Cinnabar | `#22242A` \u00b7 `#E9E3D4` \u00b7 `#D64A2E` | **Sharp & premium** \u2014 vermilion snaps hard against warm graphite; best for a bold primary CTA. |\n| B | Charcoal + Fog + Chrome Yellow | `#26282C` \u00b7 `#C7C7C2` \u00b7 `#E7B21E` | **High-energy fintech** \u2014 near-black with a gold jolt; excellent for balance highlights and scan/pay buttons. |\n| C | Blue-Graphite + Pale Slate + Verdigris Teal | `#232A31` \u00b7 `#B9C2C2` \u00b7 `#37A08C` | **Secure & fresh** \u2014 cool graphite with a teal \"success/received\" accent; the safest of the four. |\n| D | Warm Graphite + Oat + Marigold | `#282521` \u00b7 `#DAD2C0` \u00b7 `#E39A1F` | **Confident & warm** \u2014 brown-leaning near-black with a saffron accent; feels crafted, not sterile. |\n\nRule for the graphite set: the vivid should occupy roughly **5\u201315%** of the screen (CTA, active tab, key figure). Everything else stays graphite-and-neutral so the accent reads as the single actionable \"event.\"\n\n---\n\n### Seed rules distilled for the generator\n1. Pull all colors toward **one low-chroma undertone**; no pure primaries.\n2. Cluster fields in a **mid-value band**, separate by **hue not brightness**.\n3. Admit exactly **one event** per palette \u2014 a vivid accent *or* a graphite anchor.\n4. Cap accent area (~\u226425% general, ~\u226415% on graphite grounds).\n5. Prefer colors with a **material/historical lineage** (ochre, cinnabar, verdigris, cobalt, terra cotta) \u2014 that impurity is what keeps \"bold\" from tipping into \"gaudy.\"", "adams": "# The Designer's Dictionary of Color (Sean Adams) \u2014 applied to a fintech UI\n\n## 1. How color carries meaning, and Adams' rules for confidence + restraint\n\nAdams' central thesis: **a color has no fixed meaning \u2014 meaning is produced by context, culture, value, saturation, and the color next to it.** The same hue reads \"cheap\" or \"luxury\" depending entirely on how it's handled. His working lessons, translated to a money app:\n\n**Individual hues (his family entries), fintech-relevant:**\n- **Blue** \u2014 trust, security, calm, competence. The reason finance defaults here. But default \"corporate blue\" is also a clich\u00e9; Adams' fix is to *shift the blue* (toward navy, teal, or slate) rather than use a stock primary.\n- **Green** \u2014 growth, money, \"go,\" health, positive balance. Powerful for finance, but literal (\"dollar green\") reads dated; push it toward deep emerald or a cooler eucalyptus.\n- **Black** \u2014 sophistication, authority, premium. The single fastest way to make a palette feel expensive.\n- **Yellow/Gold** \u2014 optimism and attention, but the most dangerous hue: cheap and anxiety-inducing at high saturation. As *gold* (desaturated, warm) it signals value; as pure yellow it signals caution/warning.\n- **Red** \u2014 urgency, alert, loss. In finance reserve it almost entirely for errors, declines, negative deltas \u2014 never as a brand primary, or every screen feels like an emergency.\n- **Purple** \u2014 luxury, imagination, \"challenger fintech\" (the Monzo/N26 lane). Differentiates from legacy-bank blue but must be handled with restraint or it turns toy-like.\n- **Gray/Neutral** \u2014 Adams treats neutrals as active design choices, not filler. A precisely tuned warm or cool gray is what actually carries a premium interface.\n\n**Pairs create the meaning.** Adams stresses that combinations, not single colors, communicate. A pairing's *value contrast and temperature relationship* set the tone: navy + gold = established/premium; black + green = modern wealth; teal + coral = approachable/human. Design the *relationship* first, the individual swatches second.\n\n**His rules for using color with confidence and restraint:**\n1. **Limit the palette.** One dominant, one accent, plus neutrals. Confidence reads as few colors used deliberately; insecurity reads as many colors hedging.\n2. **Value and saturation do more work than hue.** Most \"which color\" problems are really \"which value/saturation.\" Get the lightness relationships right and almost any hue works.\n3. **Avoid the default/pure primaries.** Stock `#FF0000`, `#0000FF`, `#FFFF00` read as cheap and unconsidered. Always use a *specified*, slightly complex mix.\n4. **Commit.** A bold color used at full conviction beats a timid tint. Restraint means *fewer* colors, not *weaker* ones.\n5. **Let neutrals and whitespace carry the load** so the one accent lands with impact.\n\n## 2. Choosing ONE dominant + ONE accent (bold yet trustworthy)\n\nAdams' method for a palette that is simultaneously confident and credible:\n\n- **Dominant = the trust/stability anchor.** Choose a deep, low-to-mid-saturation hue that can own ~60% of the surface: a navy, near-black, deep teal, or forest. Deep + slightly desaturated = \"established and safe.\" This carries brand, headers, primary surfaces.\n- **Accent = the energy/confidence signal.** Choose ONE higher-chroma or brighter hue for ~10% use: CTAs, active states, key figures, positive deltas. This is where boldness lives.\n- **Relationship rules that produce \"bold yet trustworthy\":**\n  - **High value contrast** between the two (deep dominant vs. bright accent) \u2014 this is what makes it feel bold without adding more colors.\n  - **Restrict the accent to meaning-bearing moments** (the \"Pay,\" the balance, the confirmation). Scarcity is what makes it feel intentional and premium rather than loud.\n  - **Temperature tension over analogous safety.** A cool dominant with a warm accent (navy + amber, forest + coral) feels alive; two neighbors on the wheel feels muted and forgettable.\n  - **Everything else is neutral.** The dominant and accent should be the *only* two chromatic voices; grays and off-whites do the rest.\n- **60 / 30 / 10:** dominant 60% (surfaces/brand), neutral 30% (backgrounds/text/structure), accent 10% (action). This is the structural expression of Adams' restraint.\n\n## 3. Pitfalls: cheap vs. premium\n\n| Cheap | Premium (Adams' correction) |\n|---|---|\n| Pure/default primaries (`#FF0000`, `#0000FF`) | Specified, slightly complex, off-primary hues |\n| Many competing colors (\"rainbow dashboard\") | 1 dominant + 1 accent + disciplined neutrals |\n| High-saturation everything, no rest | High saturation reserved for one small accent |\n| Pure `#000000` / pure `#FFFFFF` slabs | Near-black (`#0B0F1A`) and warm/cool off-whites |\n| Literal \"money green\" and stock corporate blue | Shifted emerald / navy / teal that feel authored |\n| Unmodulated flat gray (`#808080`) | Tinted neutrals (warm or cool grays) that harmonize |\n| Yellow/red used casually as brand color | Yellow\u2192gold; red reserved strictly for alerts |\n| Weak value contrast (everything mid-tone, muddy) | Strong, deliberate dark-to-light hierarchy |\n| Gradients/glows to fake richness | Richness from value + restraint, not effects |\n\nThe throughline: **cheapness comes from defaults, excess, and literalness; premium comes from specificity, restraint, and controlled contrast.**\n\n## 4. Eight color directions Adams' thinking endorses for a money app\n\nEach is a **dominant + accent + neutral** triad, since Adams insists meaning lives in the pairing.\n\n**1. Establishment Navy + Gold** \u2014 legacy trust, quietly premium\n- Dominant `#12203A` \u00b7 Accent `#C8A24B` \u00b7 Neutral `#F4F1EA`\n\n**2. Modern Wealth (Black + Emerald)** \u2014 sophisticated, \"growth\" without literal money-green\n- Dominant `#0E1512` \u00b7 Accent `#1FB574` \u00b7 Neutral `#EDEFEA`\n\n**3. Deep Teal + Coral** \u2014 human, approachable, challenger-bank warmth\n- Dominant `#0E4C4C` \u00b7 Accent `#FF6B57` \u00b7 Neutral `#F5F1EC`\n\n**4. Challenger Purple + Lime** \u2014 differentiated, youthful fintech energy, kept disciplined\n- Dominant `#2E1A47` \u00b7 Accent `#C6F24E` \u00b7 Neutral `#F3F0F7`\n\n**5. Slate Blue + Amber** \u2014 calm competence with a warm confidence signal\n- Dominant `#1E293B` \u00b7 Accent `#F5A623` \u00b7 Neutral `#F1F3F6`\n\n**6. Forest + Sand** \u2014 grounded, dependable, \"safe savings\" earthiness\n- Dominant `#16301F` \u00b7 Accent `#E3B04B` \u00b7 Neutral `#F6F2E9`\n\n**7. Ink Black + Electric Blue** \u2014 precise, techy, high-value-contrast boldness\n- Dominant `#0B0F1A` \u00b7 Accent `#3B82F6` \u00b7 Neutral `#EDF0F5`\n\n**8. Plum + Rose Gold** \u2014 premium-luxe, differentiated from every blue competitor\n- Dominant `#2A1622` \u00b7 Accent `#D8A0A0` \u00b7 Neutral `#F5EFEF`\n\n**Semantic set to pair with any triad above** (Adams: reserve red/green strictly for meaning): positive `#1FB574`, warning/gold `#F5A623`, error `#E5484D`, info matches the accent.\n\n**Seed rules for the generator:** (a) dominant lightness 8\u201320%, saturation moderate; (b) accent lightness 55\u201372%, higher chroma, used \u226410% of surface; (c) never emit pure-primary or pure `#000`/`#FFF` \u2014 tint neutrals warm or cool to match the dominant's temperature; (d) enforce one-dominant-one-accent; treat additional hues as errors, not options; (e) require strong value contrast (\u226540 L*) between dominant and accent.", "trends": "# Dominant Visual-Design Trends in Top-Tier Mobile Apps (Fintech / Wallet), 2023\u20132026\n\n## 1. Color\n\n**The graphite-and-single-accent system became the default \"serious money\" look.**\nThe most-copied 2023\u20132025 move is a near-black or graphite canvas paired with exactly one saturated accent. It reads premium, keeps balance figures legible, and lets one brand color do all the work.\n- **Mercury** \u2014 cool graphite/near-black UI (~`#1A1A1A`/`#0E0E10`) with restrained violet-blue accents; the definitive \"fintech for operators\" look.\n- **Robinhood** \u2014 moved from its signature green to a black-first UI with neon-lime signal green (`#CCFF00`/`#C9F73E` family) reserved for CTAs and up-states. High-contrast, \"terminal\" energy.\n- **Revolut** \u2014 dark, glossy near-black cards with metallic/holographic material treatments; accent blues and per-tier card finishes (metal, Ultra) doing the differentiation.\n- **Apple Card / Wallet** \u2014 the origin reference: white/graphite card, color as a subtle spending-category gradient, everything else neutral.\n\n**Bold single-color color-fields (the \"brand-as-canvas\" look).**\nInstead of accent-on-neutral, some brands flood the whole screen in one loud brand color.\n- **Cash App** \u2014 the pure `#00D632` green flood; whole screens go edge-to-edge green, black type, minimal chrome. Instantly recognizable, very \"dopamine.\"\n- **Nubank** \u2014 the iconic purple `#820AD1` as a full-bleed field; one of the strongest brand-color equities in fintech.\n- **Monzo** \u2014 hot coral/salmon (`#FF3464`-ish) plus the \"hot coral\" physical card; playful, warm.\n- **N26** \u2014 clean white/light canvas with teal-aqua accents (`#48ACAB`/mint family); the \"European minimalist\" counterpoint to all the black UIs.\n\n**Gradients / aurora / mesh.**\nAfter the flat-design decade, soft multi-stop gradients and blurred \"aurora\" meshes returned \u2014 but as *lighting*, not decoration.\n- **Wise** \u2014 rebranded to a bright, warm palette: signature bright green (`#9FE870`) with forest-green (`#163300`) type/backgrounds, plus expressive gradient illustration. One of the most distinctive 2023 rebrands.\n- **Revolut / Coinbase** \u2014 aurora mesh gradients behind hero/balance areas.\n- **Coinbase** \u2014 moved toward a cleaner blue (`#0052FF`) with soft gradient washes.\n- Aurora/mesh is now the standard treatment for splash, onboarding, and \"empty state\" hero panels: large-radius blurred blobs of 2\u20133 hues drifting behind sharp foreground UI.\n\n**Dopamine palettes (2025\u21922026 emerging).**\nReaction to years of graphite: saturated, slightly \"candy\" secondary palettes \u2014 electric lime, hot magenta, tangerine, cyan \u2014 used as data-viz and category coding on top of a neutral base. Robinhood's lime, Monzo's coral, and Cash App's green anticipated this; the 2026 version is *multi*-accent dopamine coding (each spending category / account gets its own vivid hue) rather than one brand color.\n\n## 2. Balance-Card / Hero Treatments\n\n- **The balance is the hero, and it's huge.** The primary account balance is set in oversized display type (often 40\u201364px), top-of-screen, frequently the single largest element on Home. Cash App, Revolut, Mercury all lead with the number.\n- **Card-as-object realism returned** via material: metallic sheen, holographic foil, subtle grain, and gyroscope-reactive glints on the virtual card (Revolut metal tiers, Apple Card's titanium-look). The flat card rectangle of 2018 is now a rendered object.\n- **Glassmorphism for stacked cards.** Frosted-glass translucency (backdrop blur, thin light borders) for stacked/overlapping account cards and bottom sheets \u2014 softened from the harsh 2020 version into subtle depth.\n- **The single \"SimpliPay-style\" branded tile** \u2014 a hero tile that *is* the brand, combining wordmark + balance + primary action, is now a common Home anchor (matches the direction in your recent commits).\n- **Bento-grid Home layouts (2024\u20132026).** Borrowed from hardware/OS marketing: Home as a grid of differently-sized rounded tiles (balance big, quick-actions medium, insights small). Replaces the old vertical list. Corner radii went *up* \u2014 20\u201328px rounded rectangles are the norm; some brands push to 32px+.\n\n## 3. Typography\n\n- **Weight went up and got more expressive.** Heavy/black display weights for balances and screen titles; the \"quiet luxury\" of medium-weight grotesques for everything else.\n- **Grotesque sans dominate.** Custom and near-custom grotesks: Wise's own type, Monzo's, Revolut's Aeonik-adjacent choices, Mercury's clean neo-grotesque. Inter, S\u00f6hne, and Aeonik are the reference families everyone samples.\n- **Tabular / monospaced numerals for money.** Fixed-width lining figures so digits don't jitter when balances update \u2014 near-universal in top-tier wallets now.\n- **Big type + tight tracking** for headings; generous line-height and restrained size for body. The contrast between a massive balance and small quiet labels *is* the hierarchy.\n\n## 4. Iconography\n\n- **Duotone and rounded-stroke icon sets.** Consistent 1.5\u20132px rounded strokes; two-tone fills that pick up the brand accent. Phosphor-style and custom rounded sets replaced thin-line monoline.\n- **Filled, softly-rounded quick-action glyphs** inside pill or squircle buttons on Home (Send / Request / Scan / Pay).\n- **Squircle everything** \u2014 Apple's continuous-corner \"superellipse\" squircle is the standard container shape for icons, avatars, and action buttons.\n- **Occasional 3D / claymorphic icons** for onboarding and marketing surfaces (soft-shadowed, matte, tactile) \u2014 used sparingly, not in dense UI.\n\n## 5. Motion\n\n- **Spring physics, not linear easing.** Everything settles with a slight overshoot; balance counts up with an odometer/roll animation.\n- **Number roll-ups** on the balance when the screen loads or a transaction lands \u2014 signature Cash App / Revolut moment.\n- **Animated wordmarks on splash** (exactly your recent \"animated SimpliPay wordmark\" commit) \u2014 letterforms draw/fade/settle, then hand off to Home with a shared-element transition.\n- **Shared-element / continuous transitions.** The card tile on Home expands into the card-detail screen; the balance persists across navigation. Compose's shared-element transitions and iOS's fluid interruptible animations made this table-stakes for award-tier apps.\n- **Haptic-synced micro-interactions.** Success checkmarks, confetti (Cash App payment success), and subtle haptics on confirm.\n- **Ambient motion on hero.** Slowly drifting aurora/mesh gradients behind the balance \u2014 alive but not distracting.\n\n---\n\n## 6 Directives \u2014 \"2026 and Award-Worthy\" for a Wallet's Splash + Home\n\n**Splash**\n\n1. **Animated wordmark on a living aurora field, not a static logo.** Open on a graphite canvas (`#0E0E12`\u2013`#141418`) with a slow-drifting 2\u20133 stop mesh gradient (pick one brand hue + one dopamine secondary, e.g. brand violet \u2192 electric cyan). The SimpliPay wordmark draws in with spring-settled letterforms, then the whole field compresses into the Home balance tile via a shared-element transition. No hard cut between splash and Home \u2014 one continuous move.\n\n2. **Commit to ONE signature accent and make it load-bearing.** Choose a single saturated hue that owns your brand the way `#00D632` owns Cash App and `#820AD1` owns Nubank. Everything else stays graphite/neutral so that accent means \"money / action / go.\" Reserve it for the balance underline, the primary CTA, and up-states only \u2014 scarcity is what makes it read premium.\n\n**Home**\n\n3. **Make the balance the undisputed hero: oversized display weight + tabular numerals + odometer roll-up.** Set the primary balance at 48\u201360px in a heavy grotesque with fixed-width figures, top-of-screen, animating up on load. It should be the single largest, brightest element \u2014 everything else defers to it.\n\n4. **Adopt a bento grid with continuous-corner squircles (24\u201328px radius).** Replace any vertical list Home with a tile grid: balance tile large, quick-actions (Send / Request / Scan / Pay) as a medium row of filled duotone glyphs in squircle buttons, insights/recent as smaller tiles. Differently-sized rounded tiles read as 2025\u201326 instantly.\n\n5. **Render the card as a real object, not a flat rectangle.** Give the wallet card material \u2014 subtle grain or metallic sheen, a thin light top-border, and a gyroscope-reactive glint that shifts with device tilt. This is the single highest-perceived-quality detail in Revolut/Apple Card and cheap to add.\n\n6. **Layer dopamine as category coding, not chrome.** Keep the shell graphite + one accent, but let spending categories / accounts each carry a vivid secondary hue (lime, magenta, tangerine, cyan) in the insights tiles and transaction rows. Pair with spring-physics transitions, a shared-element card\u2192detail expand, and haptic-synced success states (checkmark + light confetti on a completed payment). That combination \u2014 restrained luxury base, dopamine accents in the data, physical card, fluid continuous motion \u2014 is what reads as 2026 award-tier rather than 2022 flat.\n\n**Quick palette scaffold to build from:** canvas `#0E0E12`, elevated surface `#1A1A20`, hairline border `#2A2A33`, primary text `#F5F5F7`, secondary text `#9A9AA6`; then your single brand accent + a 4-hue dopamine set for category coding. This mirrors the Mercury/Robinhood graphite base while leaving room for the Cash App/Nubank-style brand-color moment on splash.", "awards": "# Design-Awards Jury Analysis \u2014 Recurring Qualities & 10-Point Rubric for a Wallet's Splash + Home\n\n## What the juries actually reward (2022\u20132026 synthesis)\n\nAcross Apple Design Awards, Awwwards (Site/App/Mobile of the Year), CSS Design Awards, FWA, and Fast Company Innovation by Design, fintech/mobile winners cluster on a consistent set of traits. The through-line is **conviction over decoration**: award-winning work makes a small number of bold, deliberate choices and executes them with obsessive consistency.\n\n**Color: bold POV OR disciplined restraint \u2014 never timid/muddy.** Winners either own one brave brand color (Monzo hot coral, Nubank purple, Cash App green, Robinhood green\u2192neon) or commit to editorial restraint with a near-monochrome base plus one accent (Stripe, Mercury, Ramp, Copilot Money). What loses: three or four mid-saturation colors fighting each other with no hierarchy.\n\n**Contrast & accessibility are table stakes, not extra credit.** ADA has a dedicated Inclusivity award; Awwwards scores usability. WCAG AA text contrast, legible-at-arm's-length, and full light/dark parity are assumed.\n\n**Typographic confidence.** Large display type, a tight 1\u20132 family system, a clear modular scale, and \u2014 critical for wallets \u2014 **tabular/monospaced-lining numerals** so balances and amounts align and read as data. Cash App and Wise are canonical for big-type confidence; Copilot Money for refined financial typography.\n\n**Hierarchy = one hero per screen.** On a wallet Home the balance/amount is almost always the single focal element, with actions and lists subordinate. Winners have obvious eye-entry; losers spread emphasis evenly.\n\n**Craft & consistency.** Consistent spacing rhythm, corner radii, icon weight, and alignment to a grid. Juries read this as a token system, not per-screen guesswork. Stripe and Apple's own apps are the reference bar.\n\n**Memorability / a signature.** One ownable element \u2014 a mark animation, a distinctive tile, a color, a numeral style. Not Boring apps (Andy Works, ADA 2022 Delight & Fun) win almost entirely on a memorable signature feel.\n\n**Motion with purpose.** Physics-based, spatial, reinforcing hierarchy and continuity (shared-element transitions, a splash mark that resolves into the app). Delight is rewarded; gratuitous animation is penalized. Copilot Money (ADA 2024) and Not Boring apps are the motion exemplars.\n\n**Named winners to anchor against:** Copilot Money (ADA 2024), Not Boring Weather/Habits (ADA 2022), Cash App, Monzo, Nubank, Wise, Revolut, N26, Robinhood, Stripe, Mercury, Ramp (fintech restraint end); Duolingo/Flighty (ADA interaction & delight craft).\n\n---\n\n## The 10 criteria (each phrased as a 0\u201310 rubric line)\n\nScore 0 = absent/actively bad, 5 = competent but generic, 8 = distinctive and correct, 10 = award-caliber signature. Apply to **Splash** and **Home** specifically.\n\n**1. Color conviction.** Does the palette commit to a clear POV \u2014 one brave ownable hue or deliberate near-mono + single accent \u2014 rather than 3+ muddy competing colors? *(10 = Monzo/Nubank boldness or Stripe/Mercury restraint; 3 = timid, unowned mid-tones.)*\n\n**2. Contrast & accessibility.** Do all text/UI pairs meet WCAG AA (4.5:1 body, 3:1 large), and is nothing conveyed by color alone? *(Checkable: run contrast on balance, labels, nav, buttons.)*\n\n**3. Light/dark parity.** Do both Splash and Home render correctly and beautifully in both modes, with the brand color holding up on both grounds? *(No wash-out, no dark-mode-as-afterthought.)*\n\n**4. Typographic confidence.** Is there a real display moment (large, deliberate) and a coherent 1\u20132 family scale \u2014 not default sizes stacked flat? *(10 = Cash App / Wise big-type command.)*\n\n**5. Numeral craft for money.** Are balances/amounts set in tabular/lining numerals, aligned, with consistent currency formatting so financial data reads as data? *(Wallet-specific; heavily separates finalists.)*\n\n**6. Hierarchy / single hero.** On Home, is there exactly one unmistakable focal point (the balance) with a clear eye-entry path and subordinate actions? *(10 = instant read; 3 = evenly weighted, no focus.)*\n\n**7. Spacing & grid craft.** Are spacing rhythm, corner radii, and icon weights consistent and grid-aligned across both screens \u2014 evidence of a token system? *(Checkable: measure gaps/radii for a shared scale.)*\n\n**8. Memorable signature.** Is there one ownable, repeatable element a juror would recall afterward (mark, tile, motif, numeral style)? *(10 = Not Boring-level distinctiveness; 0 = interchangeable template.)*\n\n**9. Purposeful motion & Splash\u2192Home continuity.** Does the splash mark resolve into the app via a physics-based, continuous transition that reinforces (not decorates) hierarchy? *(10 = Copilot/Flighty-grade; penalize gratuitous or janky motion.)*\n\n**10. Restraint & density balance.** Is there generous, confident whitespace and a clear content-to-chrome ratio \u2014 bold where it matters, quiet everywhere else? *(10 = editorial calm of Mercury/Ramp; 3 = cramped or noisy.)*\n\n---\n\n**Scoring note for the rubric author:** criteria 5, 9, and 10 are the strongest finalist-vs-winner discriminators for a *wallet* specifically; 2 and 3 are gates (a low score here should cap the overall, since juries treat accessibility failures as disqualifying regardless of beauty)."}, "champions": [{"gen": 1, "champion": {"id": "g1-graphite-1", "gen": 1, "lens": "graphite", "name": "Terminal Lime", "position": "The Mercury/Robinhood move: bottle-green graphite shell, one acid-lime ignition.", "family": "graphite + acid-lime", "rationale": "A cool-green-tinted near-black (nev al balance odometer", "family": "graphite-navy + ultramarine + saffron", "rationale": "Bred directly from the generation's proven winner: kept the AAA-clean ultramarine/saffron trust pair verbatim but pushed the differentiator the critics flagged as empty field \u2014 the numeral system. Balance uses tabular lining figures that roll up on load, saffron reserved to exactly three roles (balance chip, wordmark period, tab), never bleeding into a fourth.", "wadaRef": "Ultramarine + saffron \u2014 history's oldest cross-temperature trust pairing (Wada's indigo/kihada), executed with odometer-numeral craft as the ownable signature", "boldness": 8, "tokens": {"canvas": "#0A0A10", "bg": "#14141C", "surface": "#1D1E2A", "ink": "#F5F5F8", "sub": "#9A9CB0", "line": "#2B2C3A", "brand": "#2A46CC", "brandDeep": "#1B2E8A", "onBrand": "#F5F5F8", "tint": "#23264A", "accent": "#E8B429", "onAccent": "#1B1204", "good": "#3FBF7F", "bad": "#E5484D"}, "splash": {"splashBg": "ink", "composition": "centered-glow", "glow": "brand", "wordmarkInk": "ink", "wordmarkAccent": "accent", "note": "Saffron glow breathes once, then settles into wordmark"}, "home": {"balanceFill": "brandDeep", "balanceInk": "onBrand", "balanceAccent": "accent", "actionStyle": "tint", "accentStrategy": "balance-amount", "tabActive": "accent", "note": "Tabular saffron digits roll up like an odometer on load"}, "contrast": {"inkOnBg": 16.83, "subOnBg": 6.76, "onBrandOnBrand": 6.78, "onAccentOnAccent": 9.69, "accentOnBg": 9.59}, "scores": {"boldness": 7.5, "taste": 8, "hierarchy": 8.5, "trend": 8.5, "awardWorthiness": 8.5, "accessibility": 9, "overall": 8.5, "notes": ["Proven ultramarine/saffron refined with tabular odometer and 3-role scarcity; ownable signature, flawless contrast.", "Flagship: ultramarine/saffron, odometer signature, ruthless 3-role scarcity, AAA. Nameable."]}, "rank": 1}}], "generations": [{"gen": 1, "synthesisTrends": "WINNING: The graphite-canvas + one-load-bearing-accent family is decisively ahead, exactly as the brief predicts. The two clear finalists are Terminal Lime (g1-graphite-1) and Ultramarine Vault (g1-wada-3) \u2014 both put a single saturated, nameable hue on a tinted near-black, keep the accent scarce and load-bearing on balance/CTA/tab, and clear AA comfortably. Terracotta Ember (g1-saturated-6) proves the saturated-flood lens can still win when the flood is scarce and the base stays dark. Graphite Verdigris (g1-wada-6) is the taste ceiling (single-hue, cannot tip gaudy) and Static Violet (g1-graphite-6) is the only entry attempting a real hierarchy signature via the inverted white balance card \u2014 that structural move should be stolen and paired with a more trustworthy accent than #9D4EFF.\n\nFAILING: (1) Every light/cream-ground design collapses on the accessibility gate \u2014 accents land at 1.27\u20133.57 on light backgrounds (Berry Static's lime tab at 1.27, Vermilion Flood's gold at 1.87, Oxblood Folio's gold at 2.32), and warm secondary text repeatedly misses 4.5. Light grounds also read 2022-print, not 2026. (2) Full brand-color floods behind live financial data (Vermilion, Verdigris Tide, Berry, Marigold Field) violate the trust rule and mostly fail contrast on the card. (3) Analogous pairings (Rose Madder plum+magenta) and cool+cool pairings (Signal Cyan) waste boldness with no temperature tension. (4) Amber Broadsheet mistakes \"dark ink as the event\" for a bold accent \u2014 it is timid. (5) Gradient balance fills (Aurora Graphite 3.79 on-brand) endanger the single most important numeral on the screen \u2014 ban gradients under the balance figure.\n\nNEXT GENERATION \u2014 direction: Commit fully to graphite/near-black canvases (kill all cream/paper grounds; they cannot pass the gate or the trend). Double down on cross-temperature pairs on dark: cool graphite + one warm mineral accent \u2014 cinnabar, marigold, saffron, terracotta \u2014 and cool-shell + warm-accent should be the default. Keep ultramarine+saffron and bottle-green+acid-lime; drop electric cyan (stock), magenta/violet (toy/crypto and analogous plum pairings have no tension), and pure high-chroma yellow floods (anxiety). Put boldness in placement and structure, not area: adopt the inverted-hero balance card from Static Violet, enforce the two-role accent cap (Ember's hairline-everywhere is the failure mode), and reserve the accent for balance-amount + CTA + active-tab only. Where the field needs to separate more, use value contrast and the odometer/tabular-numeral hero \u2014 the numeral craft and splash\u2192Home motion continuity are the untested discriminators that will separate a winner from these finalists; none here have earned a 9 on award-worthiness yet.", "synthesisColor": "WHAT IS WINNING: the graphite-canvas + one-material-lineage-accent formula, executed with scarcity. Ultramarine Vault (wada-3) is the reference \u2014 lapis/gold is history's trust signature, rebuilt on the exact #0E0E12 scaffold, accent quarantined to balance/CTA/tab, every pair comfortably AA. Terminal Lime (graphite-1), Voltage Amber (graphite-4), Oxblood Ledger (wada-1) and Teal Meridian (wada-2) share the same virtues: one cool dominant, one warm/mineral escape note, \u226540 L* value jump, and contrast headroom to spare. Wada's actual textile pairings (oxblood/sage, teal/apricot, aubergine/marigold, prussian/persimmon) consistently outscore the invented neon pairings because pre-greyed, dye-ancestry hues cannot tip gaudy.\n\nWHAT IS FAILING: three things. (1) Accessibility on light-ground floods \u2014 Vermilion Flood (gold balance 1.87, onBrand 4.27) and Berry Static (lime 1.27) put the HERO figure below legibility; both are disqualified, capped at 4. Oxblood Folio, Terra Ledger, Coral Broadside and Warm-3 all ride 2.3\u20134.4 on their accent-as-text or secondary text \u2014 saturated accents simply do not carry text on cream, so light themes must move the accent onto dark fills or use it non-textually only. (2) Hue-meaning drift \u2014 Reactor Magenta, Rose Madder and Luminous-6's #FF4FA0/#F5399C read social/playful/crypto, not money; Cinnabar-3 puts an error-adjacent red in the structural slot; Cobalt-4 slides toward stock-primary blue. (3) Discipline lapses \u2014 Ember Graphite's hairline-everywhere and any two-warm-hue pairing (cinnabar+marigold) dilute the temperature tension that makes the good ones feel alive.\n\nNEXT DIRECTION: commit to the graphite + single mineral-accent system and stop generating light-ground saturated floods behind live balances \u2014 reserve full brand floods for splash only. Prefer accents with pigment ancestry and genuine cross-temperature tension over the cool dominant (ultramarine+saffron, navy+cinnabar, teal+apricot, oxblood+sage/marigold); drop hot fuchsia/magenta/electric-cyan entirely as brand primaries. Hold every text-bearing pair \u2014 especially the balance figure \u2014 at \u22654.5 (target AAA 7+ on the hero), never merely the 3.0 large-text floor several finalists lean on. Add the missing wallet discriminators the color data can't show: tabular lining numerals, odometer roll-up, and a continuous splash\u2192Home shared-element move. Push one or two more warm-graphite \"dusk\" shells (Marigold Manifesto's register) so bold does not always mean cold.", "designs": [{"id": "g1-graphite-1", "gen": 1, "lens": "graphite", "name": "Terminal Lime", "position": "The Mercury/Robinhood move: bottle-green graphite shell, one acid-lime ignition.", "family": "graphite + acid-lime", "rationale": "A cool-green-tinted near-black (never true #000) carries 90% of the surface; a single acid-lime hue is the only saturated color in the system, reserved for the balance figure and the active tab. Deep bottle-green (not pure black) gives the graphite an undertone so it reads crafted rather than default-dark-mode.", "wadaRef": "Sean Adams restraint principle \u2014 one dominant, one accent, verdigris/lime lineage keeps it 'terminal' not toy", "boldness": 8, "tokens": {"canvas": "#0 "onBrand", "balanceAccent": "accent", "actionStyle": "solid", "accentStrategy": "icons-and-cta", "tabActive": "accent", "note": "Electric berry hero, lime action icons"}, "contrast": {"inkOnBg": 16.77, "subOnBg": 5.36, "onBrandOnBrand": 6.03, "onAccentOnAccent": 11.64, "accentOnBg": 1.27}, "scores": {"boldness": 9, "taste": 4, "hierarchy": 6, "trend": 6, "awardWorthiness": 4.5, "accessibility": 3, "overall": 4, "notes": ["Berry+acid-lime reads casino; lime active tab 1.27 on light is invisible. Disqualified on access.", "Lime accent at 1.27 on cream is unreadable as tab/icon; berry+lime is a dashboard rave."]}, "rank": 30}]}, {"gen": 2, "synthesisTrends": "WHAT IS WINNING: The graphite-canvas + one-load-bearing-accent doctrine is decisively validated \u2014 every top scorer sits on a tinted near-black shell with a single scarce accent, and all clear the accessibility gate comfortably. Two moves separate finalists from the pack: (1) the STRUCTURAL INVERSION \u2014 a light/cream/lavender hero card floating out of a dark shell (graphite-6, luminous-5, wada-3) \u2014 which earns the hierarchy axis through value, not hue, and is the single best differentiator in the set; and (2) NUMERAL/MOTION SIGNATURE \u2014 only wada-1 actually tested tabular lining numerals + a saffron odometer roll-up, and it is the lone entry that reaches award-worthiness through craft rather than palette alone. Distinct, gate-clearing color lanes worth doubling down on: ultramarine/saffron (history's trust pair, deepest bench), aubergine or indigo + marigold/amber (cool-plum dominant, genuinely differentiated, 40+ L gaps), and acid-lime on bottle-green (highest contrast, most ownable, but see below).\n\nWHAT IS FAILING: (1) REDUNDANCY. The set has at least three near-identical acid-lime twins (graphite-1, wada-2, luminous-2) and three interchangeable oxblood-brown \"dusk + marigold\" warm entries (graphite-5, warm-3, luminous-4). Excellent execution cannot rescue a direction the jury has already seen twice on the same board \u2014 collapse each cluster to one champion. (2) THE CINNABAR-ON-GRAPHITE ACCESSIBILITY WALL. Every cinnabar/persimmon-on-dark entry (saturated-3, wada-3, warm-4, luminous-6) lands accentOnBg at 4.4\u20135.0 \u2014 AA-large only, never comfortable on the balance figure. The hue keeps failing the same test; either deepen the ground further or brighten the pigment, don't keep re-submitting it at 4.5. (3) WARM-DOMINANT FLOODS. Marigold-as-dominant (saturated-4) courts yellow-anxiety; terracotta-dominant (warm-1) actually fails AA at 3.7 onAccent and is capped. (4) PAPER CANVAS (warm-5) is anti-trend for a 2026 money app regardless of its clean contrast \u2014 graphite is the register. (5) TIMIDITY: warm-6 and wada-6 are tasteful but under-commit; nothing snaps.\n\nDIRECTION FOR NEXT GENERATION: Push boldness into STRUCTURE and MOTION, not more hues. (a) Make the inverted-hero card the default hierarchy engine and pair it only with gate-clearing accents (amber, marigold, saffron \u2014 drop cinnabar until its contrast is fixed at the hex level). (b) Every serious contender must specify the numeral system and a splash-to-Home shared-element/odometer move \u2014 wada-1 proved this is where the winner separates, and it is currently near-empty field. (c) Prune to one lime, one warm-oxblood, one blue-gold; reinvest the freed slots in the under-explored cool-plum/indigo lanes (luminous-5, wada-4, graphite-6) which are distinct AND accessible. (d) Kill the paper direction and any terracotta/verdigris pairing that can't clear 4.5:1 on both accent pairs. Net: fewer families, deeper craft, inversion + numeral-motion as the two ownable signatures.", "synthesisColor": "WHAT IS WINNING: The graphite-shell + ONE mineral accent formula, executed with 3-role scarcity (balance/CTA/tab), owns this generation. Two anchors are genuinely premium and award-caliber: ultramarine+saffron (g2-wada-1, g2-graphite-2) \u2014 history's oldest cross-temperature trust pairing, AAA on every pair, and in g2-wada-1 backed by an ownable odometer numeral signature \u2014 and bottle-green+acid-lime (g2-wada-2, g2-graphite-1), textbook Wada 'moss and citron' with ruthless discipline; g2-wada-2 additionally fixes the brand-green/credit-green semantic clash by splitting 'good' to a distinct emerald. The most valuable diversity comes from cool-plum dominants: aubergine+marigold (g2-graphite-6, g2-wada-4) and indigo+amber (g2-luminous-5) give real hue variety with an unambiguous 40+ L* gap and no red confusion, and the inverted ivory/lavender hero is the single strongest hierarchy device in the set. Luminous entries succeed only because their gradient stops stay dark-to-mid-dark, protecting numeral contrast \u2014 that is ambient lighting, not decoration.\n\nWHAT IS FAILING: Two systemic craft errors recur. First, RED-ADJACENCY: cinnabar and persimmon accents (g2-graphite-4, g2-saturated-3/5, g2-wada-3/5, g2-luminous-3/6) repeatedly sit within a few hue-degrees of the semantic 'bad' red \u2014 a Wada relational failure, because the eye cannot decode 'money accent' from 'error/decline' when accent #E2542E and error #E5484D are nearly identical. These same warm-orange accents also chronically ride the 4.5 contrast line (onAccent 4.42\u20135.0). Second, WARM SATURATED FLOODS as the dominant field: g2-saturated-4 (marigold) induces the exact yellow-anxiety the brief bans, and g2-warm-1 (terracotta) is the one outright accessibility casualty \u2014 onBrand 4.12, verdigris-as-text 3.7, accent 4.43 \u2014 a gate failure that caps it at 5. Paper-canvas (g2-warm-5) is accessible but off-trend for a 2026 wallet.\n\nDIRECTION FOR NEXT GENERATION: Keep the graphite shell + one mineral accent, but enforce two new rules. (1) Semantic separation: whenever the accent is a warm red-orange, drag the 'bad'/error hue far toward magenta-wine (g2-warm-4 already models this) so the two never decode as the same signal \u2014 and lift every onAccent to \u22654.5 by darkening the chip. (2) Prefer accents that are structurally non-red \u2014 saffron, marigold, verdigris, amber \u2014 and diversify the DOMINANT rather than the accent: more aubergine, indigo, deep-teal cool grounds instead of a third and fourth blue. Reserve the inverted-hero move for one or two flagships, not a pattern, so it stays a signature. Kill marigold and terracotta as full-field dominants entirely. The target to beat is g2-wada-1: mineral cross-temperature pair, AAA, one ownable motion/numeral signature, zero semantic ambiguity.", "designs": [{"id": "g2-graphite-6", "gen": 2, "lens": "graphite", "name": "Aubergine Marigold Vault", "position": "The literal structural-inversion direction: an ivory balance card cut into a deep-aubergine graphite shell, marigold as the sole warm spark.", "family": "aubergine graphite + marigold", "rationale": "Fresh gene that steals the exact move critics asked for \u2014 Static Violet's inverted white hero card \u2014 and re-pairs it with the 'more trustworthy accent' they specified. Aubergine (a genuine Wada dye-ancestry hue) replaces the toy-crypto violet as the cool dominant; marigold, quarantined to CTA and active tab only, replaces the untrustworthy #9D4EFF as the warm event. The inversion itself delivers the hierarchy axis; color discipline delivers taste.", "wadaRef": "Sanzo Wada aubergine & marigold combination; inversion borrowed from g1-graphite-6 'Static Violet' (bold 9/taste 7.5/access 6.5), re-paired to fix its access gap", "boldness": 9, "tokens": {"canvas": "#0C0810", "bg": "#120C16", "surface": "#1C1420", "ink": "#F6F1F5", "sub": "#AEA0AC", "line": "#2E2334", "brand": "#3B1E4A", "brandDeep": "#210F2A", "onBrand": "#F6F1F5", "tint": "#26182E", "accent": "#E7A93E", "onAccent": "#210F2A", "good": "#6FBB86", "bad": "#D9614A"}, "splash": {"splashBg": "brandDeep", "composition": "offset-orbit", "glow": "accent", "wordmarkInk": "ink", "wordmarkAccent": "accent", "note": "Aubergine dusk orbit, marigold ember, vault abou // ---- color resolver ----
function rc(design, ref, fallback){
  if(!ref) return fallback || design.tokens.ink;
  if(typeof ref === 'string' && ref[0]==='#') return ref;
  if(design.tokens[ref]) return design.tokens[ref];
  return fallback || ref;
}
function grad(design, arr, fb){
  if(!Array.isArray(arr) || arr.length<2) return null;
  return 'linear-gradient(150deg,'+rc(design,arr[0],fb)+','+rc(design,arr[1],fb)+')';
}
function fillFor(design, kind, gradArr){
  const t = design.tokens;
  switch(kind){
    case 'brand': return t.brand;
    case 'brandDeep': return t.brandDeep;
    case 'accent': return t.accent;
    case 'ink': return t.ink;
    case 'tint': return t.tint;
    case 'surface': return t.surface;
    case 'gradient': return grad(design, gradArr, t.brand) || t.brand;
    case 'bg': return t.bg;
    default: return t[kind] || kind;
  }
}
// choose readable ink for a solid fill
function readable(hex, dark, light){
  const m=(hex||'#000').replace('#',''); if(m.length!==6) return light;
  const r=parseInt(m.slice(0,2),16),g=parseInt(m.slice(2,4),16),b=parseInt(m.slice(4,6),16);
  const L=(0.299*r+0.587*g+0.114*b);
  return L>150 ? (dark||'#111') : (light||'#fff');
}

// ---- SPLASH mockup ----
function splashHTML(d){
  const t=d.tokens, s=d.splash;
  let bgFill;
  if(s.splashBg==='gradient') bgFill = grad(d, s.splashGradient, t.bg) || t.bg;
  else bgFill = fillFor(d, s.splashBg, s.splashGradient);
  const isDark = readable(typeof bgFill==='string'&&bgFill[0]==='#'?bgFill:t.bg,'d','l')==='#fff';
  const wmInk = rc(d, s.wordmarkInk, isDark? '#ffffff': t.ink);
  const acc = rc(d, s.wordmarkAccent, t.accent);
  const glow = rc(d, s.glow, t.accent);
  const notchInk = isDark? '#ffffff': t.ink;
  let mark='';
  const comp=s.composition;
  if(comp==='concentric-rings'){
    mark='<div class="rosette rings" style="color:'+acc+'"><div class="ring" style="opacity:.35"></div>'+
      '<div class="ring" style="inset:12px;opacity:.6"></div><div class="ring" style="inset:24px;background:'+acc+';border:none"></div></div>';
  } else if(comp==='minimal-mark' || comp==='full-bleed-wordmark'){
    mark='<div class="rosette" style="background:'+acc+';border-radius:20px;transform:rotate(45deg)"></div>';
  } else if(comp==='arc-horizon'){
    mark='<div class="rosette" style="background:'+grad(d,[acc,glow],acc)+';border-radius:50% 50% 50% 50%/60% 60% 40% 40%"></div>';
  } else if(comp==='spotlight'){
    mark='<div class="rosette" style="background:radial-gradient(circle at 40% 35%,'+glow+','+acc+')"></div>';
  } else if(comp==='offset-orbit'){
    mark='<div class="rosette" style="background:'+t.brand+';position:relative">'+
      '<div style="position:absolute;width:20px;height:20px;border-radius:50%;background:'+acc+';top:-6px;right:-6px"></div></div>';
  } else { // centered-glow
    mark='<div class="rosette" style="background:conic-gradient('+acc+','+glow+','+t.brand+','+acc+')"></div>';
  }
  return '<div class="phone" style="background:'+bgFill+';color:'+notchInk+'">'+
    '<div class="notch"><i></i></div>'+
    '<div class="splashscr">'+
      '<div class="glow" style="background:'+glow+'"></div>'+ mark +
      '<div class="splash-word"><div class="wm" style="color:'+wmInk+'">simplipay<span style="color:'+acc+'">.</span></div>'+
        '<div class="splash-dots"><i style="background:'+acc+';opacity:.4"></i><i style="background:'+acc+';opacity:.7"></i><i style="background:'+acc+'"></i></div>'+
      '</div>'+
    '</div></div>';
}

// ---- HOME mockup ----
function homeHTML(d){
  const t=d.tokens, h=d.home;
  const balFill = fillFor(d, h.balanceFill, h.balanceGradient);
  const balInk = rc(d, h.balanceInk, readable(balFill,'#111','#fff'));
  const balAcc = rc(d, h.balanceAccent, t.accent);
  const chipInk = readable(balAcc,'#111','#fff');
  // quick action tile style
  const as=h.actionStyle;
  let actBg, actBorder, iconBg, iconMark, actInk;
  if(as==='solid'){ actBg=t.brand; actInk=t.onBrand; iconBg='rgba(255,255,255,.18)'; iconMark=t.onBrand; }
  else if(as==='tint'){ actBg=t.tint; actInk=t.ink; iconBg=t.brand; iconMark=t.onBrand; }
  else if(as==='ghost'){ actBg='transparent'; actInk=t.ink; iconBg=t.tint; iconMark=t.brand; actBorder='1px solid '+t.line; }
  else { actBg=t.surface; actInk=t.ink; iconBg=t.tint; iconMark=t.brand; actBorder='1px solid '+t.line; }
  const tabOn = rc(d, h.tabActive, t.brand);
  const act = (label)=> '<div class="act" style="background:'+actBg+';color:'+actInk+(actBorder?';border:'+actBorder:'')+'">'+
    '<i style="background:'+iconBg+'"><span style="position:absolute;inset:5px;border-radius:3px;background:'+iconMark+'"></span></i><span>'+label+'</span></div>';
  const txn=(label,amt,cls)=> '<div class="txn" style="border-color:'+t.line+'"><span style="color:'+t.sub+'">'+label+'</span><b style="color:'+(cls==='in'?t.good:t.bad)+'">'+amt+'</b></div>';
  return '<div class="phone" style="background:'+t.bg+';color:'+t.ink+'">'+
    '<div class="notch" style="color:'+t.ink+'"><i></i></div>'+
    '<div class="scr">'+
      '<div class="wm">simplipay<span style="color:'+t.accent+'">.</span></div>'+
      '<div class="balcard" style="background:'+balFill+';color:'+balInk+'">'+
        '<div class="bl">WALLET BALANCE</div><div class="ba">R10,560.00</div>'+
        '<div class="br"><span class="cp" style="background:'+balAcc+';color:'+chipInk+'">Default</span>'+
        '<span class="mk">•••• 0038</span></div></div>'+
      '<div class="acts">'+act('Send')+act('Receive')+act('Buy VAS')+act('Top-Up')+'</div>'+
      '<div class="txns" style="background:'+t.surface+';border:1px solid '+t.line+'">'+
        '<h4 style="color:'+t.ink+'">Transaction history</h4>'+
        txn('Pay link · Invoice','+R2,500.00','in')+txn('Beneficiary · Jane','−R450.00','out')+
        txn('Top-up','+R500.00','in')+txn('Coffee','−R38.00','out')+
      '</div>'+
      '<div class="tabbar" style="border-top:1px solid '+t.line+'">'+
        '<div class="tab on" style="color:'+tabOn+'"><i></i>Home</div>'+
        '<div class="tab" style="color:'+t.sub+'"><i></i>Pay</div>'+
        '<div class="fab" style="background:'+t.accent+'"></div>'+
        '<div class="tab" style="color:'+t.sub+'"><i></i>Finance</div>'+
        '<div class="tab" style="color:'+t.sub+'"><i></i>History</div>'+
      '</div>'+
    '</div></div>';
}

function swatches(d){
  const keys=['brand','brandDeep','accent','bg','ink','tint','good','bad'];
  return keys.map(k=>'<i style="background:'+d.tokens[k]+'" title="'+k+' '+d.tokens[k]+'"></i>').join('');
}
function scoreCell(k,label,v){
  return '<div class="sc'+(k==='overall'?' overall':'')+'"><div class="k">'+label+'</div><div class="v">'+(v??0).toFixed(1)+'</div>'+
    '<div class="bar"><i style="width:'+((v||0)*10)+'%"></i></div></div>';
}
function designCard(d, showRank){
  const s=d.scores||{};
  return '<article class="design">'+
    (showRank?'<div style="position:relative">':'')+
    '<div class="phones">'+
      (showRank?'<div class="rankbadge">#'+d.rank+'</div>':'')+
      '<div class="phlabel"><span>Splash</span><span>Home</span></div>'+
      splashHTML(d)+homeHTML(d)+
    '</div>'+
    (showRank?'</div>':'')+
    '<div class="meta">'+
      '<div class="name">'+d.name+'</div>'+
      '<div class="pos">'+(d.position||'')+'</div>'+
      '<span class="fam">'+(d.family||'')+'</span>'+
      '<div class="swrow">'+swatches(d)+'</div>'+
      '<div class="scores">'+
        scoreCell('overall','Overall',s.overall)+scoreCell('b','Bold',s.boldness)+scoreCell('t','Taste',s.taste)+
        scoreCell('h','Hierarchy',s.hierarchy)+scoreCell('tr','Trend',s.trend)+scoreCell('a','Access',s.accessibility)+
      '</div>'+
      '<div class="rationale">'+(d.rationale||'')+'</div>'+
      (d.wadaRef?'<div class="wada">↳ '+d.wadaRef+'</div>':'')+
      (s.notes&&s.notes.length?'<div class="critnotes"><b>Critics:</b> '+s.notes.join(' · ')+'</div>':'')+
    '</div></article>';
}

const totalDesigns = (DATA.generations||[]).reduce((n,g)=>n+(g.designs?.length||0),0);

  '<div class="stat"><b>'+(finalDesigns[0]?(finalDesigns[0].scores.overall).toFixed(1):'–')+'</b><span>Top score</span></div>';

let sortKey='overall';
function draw(){
  const arr=[...finalDesigns].sort((a,b)=>(b.scores[sortKey]||0)-(a.scores[sortKey]||0));
  document.getElementById('finalGrid').innerHTML = arr.map((d,i)=>{ d.rank=i+1; return designCard(d,true); }).join('');
}
const SORTS=[['overall','Overall'],['boldness','Boldest'],['taste','Most tasteful'],['awardWorthiness','Award-worthy'],['trend','On-trend'],['accessibility','Accessible']];
document.getElementById('sortControls').innerHTML = SORTS.map(([k,l])=>'<button data-k="'+k+'"'+(k==='overall'?' class="on"':'')+'>'+l+'</button>').join('');
document.querySelectorAll('#sortControls button').forEach(b=>b.onclick=()=>{
  sortKey=b.dataset.k; document.querySelectorAll('#sortControls button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); draw();
});
draw();

document.getElementById('champRail').innerHTML = (DATA.champions||[]).map(c=>{

document.getElementById('briefBody').textContent = DATA.brief || '';
document.getElementById('foot').innerHTML =
